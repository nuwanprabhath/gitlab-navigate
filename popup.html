<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>GitLab Navigate</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <h1>GitLab Navigate</h1>
      <div class="header-actions">
        <button id="mr-create" type="button" title="New merge request">MR-c</button>
        <button id="mr-assigned" type="button" title="MRs assigned to me for review">
          MR-a
        </button>
        <button id="settings-toggle" type="button" title="Repo settings" aria-label="Repo settings">
          &#9881;
        </button>
      </div>
    </header>

    <section id="settings" class="settings" hidden>
      <label for="base-input">GitLab repo URL</label>
      <div class="settings-row">
        <input
          id="base-input"
          type="text"
          spellcheck="false"
          placeholder="https://gitlab.com/group/project"
        />
        <button id="base-save" type="button">Save</button>
      </div>
      <p class="error" id="base-error" hidden></p>

      <label for="target-branch-input">Default MR target branch</label>
      <div class="settings-row">
        <input
          id="target-branch-input"
          type="text"
          spellcheck="false"
          placeholder="dev/1.0.11"
        />
        <button id="target-branch-save" type="button">Save</button>
      </div>
      <p class="error" id="target-branch-error" hidden></p>

      <label for="username-input">Your GitLab username</label>
      <div class="settings-row">
        <input
          id="username-input"
          type="text"
          spellcheck="false"
          placeholder="nuwan-tern"
        />
        <button id="username-save" type="button">Save</button>
      </div>
      <p class="error" id="username-error" hidden></p>
    </section>

    <form id="refs" autocomplete="off">
      <div class="field">
        <label for="ticket">Ticket</label>
        <input id="ticket" data-type="ticket" type="text" spellcheck="false" placeholder="2795" />
        <p class="error" data-error-for="ticket" hidden></p>
      </div>

      <div class="field">
        <label for="mr">MR</label>
        <input id="mr" data-type="mr" type="text" spellcheck="false" placeholder="1122" />
        <p class="error" data-error-for="mr" hidden></p>
      </div>

      <div class="field">
        <label for="commit">Commit</label>
        <input id="commit" data-type="commit" type="text" spellcheck="false" placeholder="5c3f861" />
        <p class="error" data-error-for="commit" hidden></p>
      </div>

      <div class="field">
        <label for="history">History</label>
        <input
          id="history"
          data-type="history"
          type="text"
          spellcheck="false"
          placeholder="dev/1.0.11"
        />
        <p class="error" data-error-for="history" hidden></p>
      </div>

      <div class="field">
        <label for="pipeline">Pipeline</label>
        <input
          id="pipeline"
          data-type="pipeline"
          type="text"
          spellcheck="false"
          placeholder="2753700544"
        />
        <p class="error" data-error-for="pipeline" hidden></p>
      </div>

      <div class="field">
        <label for="job">Job</label>
        <input id="job" data-type="job" type="text" spellcheck="false" placeholder="15853756077" />
        <p class="error" data-error-for="job" hidden></p>
      </div>

      <div class="field">
        <label for="create-mr">Create MR</label>
        <input
          id="create-mr"
          data-type="createMr"
          type="text"
          spellcheck="false"
          placeholder="fix-plot-layout-pro-expansion-issue"
        />
        <p class="error" data-error-for="create-mr" hidden></p>
      </div>
    </form>

    <section id="swap-mr" class="swap-mr" hidden>
      <button id="swap-mr-button" type="button">&#8646; Swap source/target branches</button>
    </section>

    <section id="recent" class="recent" hidden>
      <h2>Recent</h2>
      <ul id="recent-list"></ul>
    </section>

    <script type="module" src="popup.js"></script>
  </body>
</html>
