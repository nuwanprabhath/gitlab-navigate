<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>GitLab Navigate</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <h1>GitLab Navigate</h1>
      <button id="settings-toggle" type="button" title="Repo settings" aria-label="Repo settings">
        &#9881;
      </button>
    </header>

    <section id="settings" class="settings" hidden>
      <label for="base-input">GitLab repo URL</label>
      <div class="settings-row">
        <input
          id="base-input"
          type="text"
          spellcheck="false"
          placeholder="https://gitlab.com/group/project"
        />
        <button id="base-save" type="button">Save</button>
      </div>
      <p class="error" id="base-error" hidden></p>

      <label for="target-branch-input">Default MR target branch</label>
      <div class="settings-row">
        <input
          id="target-branch-input"
          type="text"
          spellcheck="false"
          placeholder="dev/1.0.11"
        />
        <button id="target-branch-save" type="button">Save</button>
      </div>
      <p class="error" id="target-branch-error" hidden></p>

      <label for="username-input">Your GitLab username</label>
      <div class="settings-row">
        <input
          id="username-input"
          type="text"
          spellcheck="false"
          placeholder="nuwan-tern"
        />
        <button id="username-save" type="button">Save</button>
      </div>
      <p class="error" id="username-error" hidden></p>
    </section>

    <section class="group">
      <h2>MRs</h2>
      <div class="group-buttons">
        <button id="mr-reviewer" type="button" title="Open MRs where I'm a reviewer">
          Reviewer
        </button>
        <button id="mr-mine" type="button" title="Open MRs assigned to me">Mine</button>
      </div>
    </section>

    <section class="group">
      <h2>Tickets</h2>
      <div class="group-buttons">
        <button id="tickets-assigned" type="button" title="Work items assigned to me">
          Assigned
        </button>
        <button id="tickets-in-progress" type="button" title="Assigned to me, status In progress">
          In progress
        </button>
        <button id="tickets-authored" type="button" title="Work items I opened">
          Authored
        </button>
      </div>
    </section>

    <section class="group">
      <h2>Pipelines</h2>
      <div class="group-buttons">
        <button id="pipelines-running" type="button" title="All running pipelines">
          Running
        </button>
        <button id="pipelines-mine" type="button" title="Running pipelines I triggered">
          Mine
        </button>
        <button id="pipelines-authored" type="button" title="All pipelines I triggered, any status">
          Authored
        </button>
      </div>
    </section>

    <section class="group">
      <h2>Create</h2>
      <div class="field">
        <label for="create-mr">Branch</label>
        <input
          id="create-mr"
          data-type="createMr"
          type="text"
          spellcheck="false"
          placeholder="fix-plot-layout-pro-expansion-issue"
        />
        <p class="error" data-error-for="create-mr" hidden></p>
      </div>
    </section>

    <section class="group">
      <h2>Go to</h2>
      <form id="refs" autocomplete="off">
        <div class="fields-grid">
          <div class="field">
            <label for="ticket">Ticket</label>
            <input id="ticket" data-type="ticket" type="text" spellcheck="false" placeholder="2795" />
            <p class="error" data-error-for="ticket" hidden></p>
          </div>

          <div class="field">
            <label for="mr">MR</label>
            <input id="mr" data-type="mr" type="text" spellcheck="false" placeholder="1122" />
            <p class="error" data-error-for="mr" hidden></p>
          </div>

          <div class="field">
            <label for="commit">Commit</label>
            <input id="commit" data-type="commit" type="text" spellcheck="false" placeholder="5c3f861" />
            <p class="error" data-error-for="commit" hidden></p>
          </div>

          <div class="field">
            <label for="history">History</label>
            <input id="history" data-type="history" type="text" spellcheck="false" placeholder="dev/1.0.11" />
            <p class="error" data-error-for="history" hidden></p>
          </div>

          <div class="field">
            <label for="pipeline">Pipeline</label>
            <input id="pipeline" data-type="pipeline" type="text" spellcheck="false" placeholder="2753700544" />
            <p class="error" data-error-for="pipeline" hidden></p>
          </div>

          <div class="field">
            <label for="job">Job</label>
            <input id="job" data-type="job" type="text" spellcheck="false" placeholder="15853756077" />
            <p class="error" data-error-for="job" hidden></p>
          </div>
        </div>
      </form>
    </section>

    <section id="swap-mr" class="swap-mr" hidden>
      <button id="swap-mr-button" type="button">&#8646; Swap source/target branches</button>
    </section>

    <section id="recent" class="recent" hidden>
      <h2>Recent</h2>
      <ul id="recent-list"></ul>
    </section>

    <script type="module" src="popup.js"></script>
  </body>
</html>
