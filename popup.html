<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>GitLab Navigate</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <h1>GitLab Navigate</h1>
      <button id="settings-toggle" type="button" title="Repo settings" aria-label="Repo settings">
        &#9881;
      </button>
    </header>

    <section id="settings" class="settings" hidden>
      <label for="base-input">GitLab repo URL</label>
      <div class="settings-row">
        <input
          id="base-input"
          type="text"
          spellcheck="false"
          placeholder="https://gitlab.com/group/project"
        />
        <button id="base-save" type="button">Save</button>
      </div>
      <p class="error" id="base-error" hidden></p>
    </section>

    <form id="refs" autocomplete="off">
      <div class="field">
        <label for="ticket">Ticket</label>
        <input id="ticket" data-type="ticket" type="text" spellcheck="false" placeholder="2795" />
        <p class="error" data-error-for="ticket" hidden></p>
      </div>

      <div class="field">
        <label for="mr">MR</label>
        <input id="mr" data-type="mr" type="text" spellcheck="false" placeholder="1122" />
        <p class="error" data-error-for="mr" hidden></p>
      </div>

      <div class="field">
        <label for="commit">Commit</label>
        <input id="commit" data-type="commit" type="text" spellcheck="false" placeholder="5c3f861" />
        <p class="error" data-error-for="commit" hidden></p>
      </div>

      <div class="field">
        <label for="history">History</label>
        <input
          id="history"
          data-type="history"
          type="text"
          spellcheck="false"
          placeholder="dev/1.0.11"
        />
        <p class="error" data-error-for="history" hidden></p>
      </div>
    </form>

    <section id="recent" class="recent" hidden>
      <h2>Recent</h2>
      <ul id="recent-list"></ul>
    </section>

    <script type="module" src="popup.js"></script>
  </body>
</html>
